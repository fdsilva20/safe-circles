services:
  web:
    build: .
    environment:
      ENV: dev
      DATABASE_URL: postgresql+psycopg://safecircles:safecircles@db:5432/safecircles
      PUBLIC_BASE_URL: http://localhost:8000
      ADMIN_EMAILS: admin@safecircles.test
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: safecircles
      POSTGRES_PASSWORD: safecircles
      POSTGRES_DB: safecircles
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safecircles -d safecircles"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
